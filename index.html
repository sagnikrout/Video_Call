<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Darpan WebRTC</title>
    <meta name="description" content="Darpan Client-side Peer-to-Peer WebRTC Video Calling Application">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS (Cache Busted) -->
    <link rel="stylesheet" href="style.css?v=2.0.0">
    <!-- PeerJS Library loaded via CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <!-- Main Application Container -->
    <div id="app-container">
        
        <!-- Header & Status Bar -->
        <header class="app-header">
            <h1 class="app-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                Darpan
            </h1>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="connection-status">Initializing...</span>
            </div>
        </header>

        <!-- Full Bleed Remote Video / Background -->
        <div id="video-container" class="full-bleed-bg">
            <video id="remote-video" autoplay playsinline style="display: none;"></video>
            <canvas id="upscale-canvas"></canvas>
            
            <div class="video-overlay-info" id="remote-video-placeholder">
                <div class="placeholder-content">
                    <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    <p>Waiting for peer...</p>
                </div>
            </div>
        </div>

        <!-- Floating Picture-in-Picture Local Video -->
        <div id="local-video-tile" class="pip-video">
            <video id="local-video" autoplay playsinline muted></video>
        </div>

        <!-- Floating Minimalist Dock -->
        <div id="control-panel" class="floating-dock">
            <!-- Info Toggle -->
            <div class="dock-group">
                <button id="info-btn" class="toggle-btn" title="Connection Info">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </button>
            </div>

            <!-- Media Toggles & Selection -->
            <div class="dock-group media-group">
                <div class="split-btn-group">
                    <button id="toggle-mic-btn" class="toggle-btn" title="Mute Mic">
                        <svg class="btn-icon mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <div class="select-wrapper">
                        <button class="arrow-btn" title="Select Microphone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <select id="mic-select" class="hidden-select"><option value="">Mic</option></select>
                    </div>
                </div>

                <div class="split-btn-group">
                    <button id="toggle-cam-btn" class="toggle-btn" title="Disable Cam">
                        <svg class="btn-icon cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                    </button>
                    <div class="select-wrapper">
                        <button class="arrow-btn" title="Select Camera">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <select id="camera-select" class="hidden-select"><option value="">Cam</option></select>
                    </div>
                </div>
            </div>

            <!-- Settings Group -->
            <div class="dock-group settings-group">
                <div class="quality-pills">
                    <button id="btn-quality-high" class="quality-btn">1440p</button>
                    <button id="btn-quality-medium" class="quality-btn active">1080p</button>
                    <button id="btn-quality-low" class="quality-btn">720p</button>
                </div>
            </div>
        </div>

        <!-- Info & Connection Panel (Hidden by default) -->
        <div id="info-panel" class="info-panel hidden">
            <div class="panel-header">
                <h2>Connection Details</h2>
                <button id="close-info-btn" class="close-btn">&times;</button>
            </div>
            
            <div class="panel-section">
                <label>Your Darpan ID</label>
                <div class="id-pill">
                    <span id="my-id-display">Generating...</span>
                    <button id="copy-id-btn" title="Copy ID">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <div class="panel-section">
                <label>Remote Peer ID</label>
                <div class="connect-pill">
                    <input type="text" id="remote-id-input" placeholder="Remote ID..." autocomplete="off">
                    <button id="connect-btn" class="action-btn primary-btn">Call</button>
                    <button id="disconnect-btn" class="action-btn danger-btn" style="display: none;">End</button>
                </div>
            </div>

            <div class="panel-section telemetry-section">
                <label>Live Network Stats</label>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Upload</span>
                        <span class="stat-value" id="stat-upload">0.00 Mbps</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Download</span>
                        <span class="stat-value" id="stat-download">0.00 Mbps</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notifications Container -->
        <div id="toast-container"></div>
    </div>

    <!-- Application & Diagnostics Scripts (Cache Busted) -->
    <script src="upscaler.js?v=2.0.0"></script>
    <script src="app.js?v=2.0.0"></script>
    <script src="debug.js?v=2.0.0"></script>
    <script src="stress.js?v=2.0.0"></script>
</body>
</html>
